<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HubTrace · Logistics Control</title>
    <link rel="preload" as="image" href="/assets/ui/splash.webp" type="image/webp" />
    <!-- 로딩 화면: JS 본체를 받기 전부터 바로 보이도록 여기에 둔다(스타일·문구·진행 표시 모두 인라인). 앱은 window.__boot로 단계를 알린다(src/boot.ts) -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #e7ebf6;
        color: #121933;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.5s ease, visibility 0.5s;
      }
      #boot.out { opacity: 0; visibility: hidden; }
      #boot .art {
        position: absolute;
        inset: -2%;
        background: url('/assets/ui/splash.webp') center / cover no-repeat;
        opacity: 0;
        transform: scale(1.06);
        transition: opacity 1.2s ease;
        animation: boot-drift 18s ease-out forwards;
      }
      #boot .art.on { opacity: 1; }
      #boot .veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 60% 55% at 50% 50%, rgba(231, 235, 246, 0.92) 0%, rgba(231, 235, 246, 0.55) 55%, rgba(231, 235, 246, 0.15) 100%);
      }
      #boot .card {
        position: relative;
        width: min(440px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 26px 26px 20px;
        border-radius: 18px;
        border: 1px solid #e7eaf2;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 60px rgba(18, 25, 51, 0.16), 0 2px 6px rgba(18, 25, 51, 0.06);
        backdrop-filter: blur(10px);
        animation: boot-rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #boot .brand { display: flex; align-items: center; gap: 12px; }
      #boot .brand svg { width: 42px; height: 42px; flex: none; animation: boot-float 3.2s ease-in-out infinite; }
      #boot .name { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; }
      #boot .sub { margin-top: 3px; font-size: 12.5px; font-weight: 600; color: #7a839c; }
      #boot .bar { position: relative; margin-top: 22px; height: 8px; border-radius: 99px; background: #dde3f0; overflow: hidden; }
      #boot .fill {
        position: absolute;
        inset: 0;
        border-radius: 99px;
        background: linear-gradient(90deg, #2f55e6, #4d6fff);
        transform-origin: left center;
        transform: scaleX(0.02);
        transition: transform 0.35s ease;
      }
      #boot .shine {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 34%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        animation: boot-shine 1.25s linear infinite;
      }
      #boot .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 10px; font-size: 13px; }
      #boot .label { font-weight: 600; color: #3b4461; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #boot .pct { font-weight: 800; color: #2f55e6; font-variant-numeric: tabular-nums; }
      #boot ol { list-style: none; margin: 16px 0 0; padding: 14px 0 0; border-top: 1px solid #f0f2f7; display: grid; gap: 8px; }
      #boot li { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: #a3abbf; transition: color 0.3s; }
      #boot li i { position: relative; width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.6px solid #d5dae6; box-sizing: border-box; transition: all 0.3s; }
      #boot li.on { color: #121933; font-weight: 600; }
      #boot li.on i { border-color: #2f55e6; border-right-color: transparent; animation: boot-spin 0.8s linear infinite; }
      #boot li.ok { color: #3b4461; }
      #boot li.ok i { border-color: #2f55e6; background: #2f55e6; }
      #boot li.ok i::after { content: ''; position: absolute; left: 4.4px; top: 1.6px; width: 3.5px; height: 7px; border: solid #fff; border-width: 0 1.8px 1.8px 0; transform: rotate(45deg); }
      #boot li b { margin-left: auto; font-weight: 600; color: #7a839c; font-variant-numeric: tabular-nums; }
      #boot .tip { margin-top: 16px; min-height: 34px; font-size: 12px; line-height: 1.45; color: #7a839c; transition: opacity 0.4s; }
      #boot .foot { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 11px; color: #7a839c; }
      @keyframes boot-shine { from { transform: translateX(-110%); } to { transform: translateX(320%); } }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-float { 50% { transform: translateY(-3px); } }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
      @keyframes boot-drift { to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #boot .art, #boot .card, #boot .brand svg, #boot .shine, #boot li.on i { animation: none; }
        #boot .art { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="art"></div>
      <div class="veil"></div>
      <div class="card">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28.1 9v14L16 30 3.9 23V9z" fill="#2F55E6" /><path d="M16 2 28.1 9 16 16 3.9 9z" fill="#7290FF" /><path d="M16 16v14l12.1-7V9z" fill="#1E3BB3" /><path d="M10 12.5 16 16l6-3.5" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" fill="none" /></svg>
          <div>
            <div class="name">HubTrace</div>
            <div class="sub" data-t="sub">Daon Logistics Control</div>
          </div>
        </div>
        <div class="bar"><div class="fill"></div><div class="shine"></div></div>
        <div class="row"><span class="label"></span><span class="pct">0%</span></div>
        <ol></ol>
        <div class="tip"></div>
      </div>
      <div class="foot" data-t="foot">Simulated data · modeled on real process steps</div>
    </div>
    <script>
      // 로딩 화면 진행 표시. 단계마다 진행률 범위가 있고, 그 안에서는 천천히 차오른다(실제 개수를 알면 그 값으로)
      ;(function () {
        var ko = false
        try { ko = sessionStorage.getItem('hubtrace.lang') === 'ko' } catch (e) {}
        document.documentElement.lang = ko ? 'ko' : 'en'
        var T = ko
          ? {
              sub: '다온 물류 관제 · 허브트레이스',
              foot: '시뮬레이션 데이터 · 실제 공정 단계를 본떠 만들었습니다',
              steps: { code: '앱 불러오기', sim: '물류 시뮬레이션 준비', scene: '3D 관제 화면 구성', assets: '모델 · 텍스처', render: '첫 화면 그리기' },
              doing: { code: '앱 코드를 받는 중…', sim: '거점 · 차량 · 화물 흐름을 예열하는 중…', scene: '거점과 도로망을 세우는 중…', assets: '3D 모델과 텍스처를 받는 중…', render: '셰이더를 준비하는 중…' },
              ready: '준비 완료',
              tips: [
                '곤지암 메가허브 · 부산신항 · 인천공항 · 대전 센터를 잇는 다온 물류망을 실시간으로 보여 줍니다',
                '아래 ‘여정 따라가기’로 택배 한 상자가 피킹부터 배송 완료까지 가는 길을 따라가 보세요',
                '부산신항↔곤지암 철송 열차와 강 위의 내륙 화물선도 움직입니다',
                'AI가 현장 보고 · 주소 오류 · 냉동 온도 알림을 읽고 바로 판단합니다',
                '차량이나 작업자를 누르면 지금 하는 일과 다음 일정을 볼 수 있습니다',
              ],
            }
          : {
              sub: 'Daon Logistics Control',
              foot: 'Simulated data · modeled on real process steps',
              steps: { code: 'Loading the app', sim: 'Logistics simulation', scene: '3D control view', assets: 'Models & textures', render: 'First frame' },
              doing: { code: 'Downloading app code…', sim: 'Warming up sites, vehicles and cargo flows…', scene: 'Raising sites and the road network…', assets: 'Fetching 3D models and textures…', render: 'Compiling shaders…' },
              ready: 'Ready',
              tips: [
                'A live view of the Daon network linking Gonjiam Mega Hub, Busan New Port, Incheon Airport and Daejeon',
                'Use ‘Follow journey’ below to trace one parcel from picking to the doorstep',
                'The Busan–Gonjiam rail shuttle and the inland river barge run on their own schedules',
                'AI reads field reports, address errors and reefer alerts and decides on the spot',
                'Click any vehicle or worker to see what they are doing and what comes next',
              ],
            }
        var root = document.getElementById('boot')
        var $ = function (s) { return root.querySelector(s) }
        root.querySelectorAll('[data-t]').forEach(function (n) { n.textContent = T[n.getAttribute('data-t')] })
        var ORDER = ['code', 'sim', 'scene', 'assets', 'render']
        var list = $('ol')
        var items = {}
        ORDER.forEach(function (k) {
          var li = document.createElement('li')
          li.innerHTML = '<i></i><span></span><b></b>'
          li.children[1].textContent = T.steps[k]
          list.appendChild(li)
          items[k] = li
        })
        // 배경 그림은 받은 뒤에 서서히
        var img = new Image()
        img.onload = function () { $('.art').classList.add('on') }
        img.src = '/assets/ui/splash.webp'

        var st = { step: 'code', p: 0, floor: 0, cap: 18, done: false }
        var listeners = []
        function paint() {
          var p = Math.min(100, st.p)
          $('.fill').style.transform = 'scaleX(' + Math.max(0.02, p / 100) + ')'
          $('.pct').textContent = Math.floor(p) + '%'
          root.setAttribute('aria-valuenow', String(Math.floor(p)))
          var at = ORDER.indexOf(st.step)
          ORDER.forEach(function (k, i) {
            items[k].className = st.done || i < at ? 'ok' : i === at ? 'on' : ''
          })
        }
        function label(text) { $('.label').textContent = text }
        label(T.doing.code)
        // 단계 안에서 천천히 차오르기(메인 스레드가 바쁠 때는 멈추고, 막대의 반짝임만 계속 움직인다)
        var creep = setInterval(function () {
          if (st.done) return
          // 상한(cap)까지는 조금씩, 실제 진행(floor)이 더 크면 그 값을 그대로
          var creepTo = st.p < st.cap ? Math.min(st.cap, st.p + (st.cap - st.p) * 0.035) : st.p
          st.p = Math.max(st.p, st.floor, creepTo)
          paint()
        }, 100)
        var tip = 0
        var tipEl = $('.tip')
        tipEl.textContent = T.tips[0]
        var tipTimer = setInterval(function () {
          tipEl.style.opacity = '0'
          setTimeout(function () { tip = (tip + 1) % T.tips.length; tipEl.textContent = T.tips[tip]; tipEl.style.opacity = '1' }, 400)
        }, 3600)
        window.__boot = {
          /** 단계 시작: 진행률을 from 이상으로 올리고, 다음 신호까지 cap 쪽으로 천천히 */
          step: function (key, from, cap) {
            if (st.done) return
            st.step = key
            st.floor = Math.max(st.floor, from)
            st.p = Math.max(st.p, from)
            st.cap = cap
            label(T.doing[key])
            items[key].querySelector('b').textContent = ''
            paint()
          },
          /** 단계 안 실제 진행(바닥값)과 오른쪽 작은 숫자(예: 12/18) */
          set: function (p, detail) {
            if (st.done) return
            st.floor = Math.max(st.floor, p)
            st.p = Math.max(st.p, p)
            if (detail !== undefined) items[st.step].querySelector('b').textContent = detail
            paint()
          },
          done: function () {
            if (st.done) return
            st.done = true
            st.p = 100
            label(T.ready)
            paint()
            clearInterval(creep)
            clearInterval(tipTimer)
            setTimeout(function () {
              root.classList.add('out')
              setTimeout(function () { root.remove() }, 600)
              listeners.splice(0).forEach(function (f) { try { f() } catch (e) {} })
            }, 380)
          },
          onDone: function (f) { if (st.done) f(); else listeners.push(f) },
          get finished() { return st.done },
        }
        paint()
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
